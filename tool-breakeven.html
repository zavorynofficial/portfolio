<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Break-even Model — Zavoryn</title><meta name="description" content="Calculate contribution-based break-even units, current monthly contribution, projected uplift and simple payback for a digital investment."><link rel="canonical" href="https://zavoryn.pages.dev/tool-breakeven.html"><link rel="stylesheet" href="assets/style.css"><link rel="icon" href="assets/img/favicon.png"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="index.html"><img class="brand-logo" src="assets/img/zavoryn-logo.png" alt="Zavoryn"></a><button class="menu-btn" type="button" aria-label="Open menu" aria-expanded="false">☰</button><nav class="nav-links"></nav></div></header><main><section class="page-hero"><div class="container"><span class="eyebrow">Zavoryn Lab / Planning</span><h1>Know how much contribution covers the investment.</h1><p>Use contribution per unit rather than revenue alone. This gives a more useful planning view of payback.</p></div></section><section class="section"><div class="container tool-grid"><article class="tool-card"><form class="tool-form" data-calc="breakeven"><label>One-time setup cost $<input name="setup" type="number" min="0" value="1000"></label><label>First-month recurring cost $<input name="monthly" type="number" min="0" value="500"></label><label>Contribution per additional unit $<input name="gross" type="number" min="0.01" step="0.01" value="75"></label><output class="tool-result" data-result>—</output><small class="copy" data-note>Model output</small><button class="btn" type="submit">Run model</button></form></article></div></section></main><footer class="site-footer"></footer><script src="assets/portfolio-data.js"></script><script src="assets/script.js"></script><script src="assets/tools.js"></script></body></html>
